apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: erp-proxy
  labels:
    {{- include "erp-jsp-weighted.labels" . | nindent 4 }}
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        name: {{ .Values.gateway.proxyServiceName }}
        type: LoadBalancer
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: erp
  labels:
    {{- include "erp-jsp-weighted.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: erp-proxy
  listeners:
    - name: http
      protocol: HTTP
      port: {{ .Values.gateway.listenerPort }}
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend
  labels:
    {{- include "erp-jsp-weighted.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: erp
  hostnames:
    {{- toYaml .Values.route.hostnames | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 8080
          weight: {{ .Values.route.stableWeight }}
        - name: frontend-canary
          port: 8080
          weight: {{ .Values.route.canaryWeight }}
      sessionPersistence:
        sessionName: ERP_GATEWAY_SESSION
        type: Cookie
        cookieConfig:
          lifetimeType: Session
