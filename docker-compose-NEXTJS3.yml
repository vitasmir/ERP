services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: erp
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
    networks:
      - projects-network
    ports:
      - "5434:5432"
    volumes:
      - erp-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./erp-backend
    restart: on-failure:5
    networks:
      - projects-network
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/erp
      DB_USERNAME: erp
      DB_PASSWORD: erp
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./erp-base-nextjs3
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8080
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_DIR: /app/var/sessions
    ports:
      - "3000:3000"
    volumes:
      - erp-nextjs3-sessions:/app/var/sessions
    depends_on:
      - backend
    networks:
      - projects-network

  remote-warehouse-mock:
    build: ./erp-remote-warehouse
    restart: unless-stopped
    ports:
      - "8091:8080"
    networks:
      - projects-network

volumes:
  erp-postgres-data:
  erp-nextjs3-sessions:

networks:
  projects-network:
    external: true
