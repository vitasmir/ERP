apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: erp-jsp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:18
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p 5432 -U erp -d erp; do
                echo "Waiting for PostgreSQL"
                sleep 5
              done
      containers:
        - name: backend
          image: erp-backend:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/erp
            - name: DB_USERNAME
              value: erp
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: erp-postgres
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  namespace: erp-jsp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: v1
kind: Service
metadata:
  name: backend-canary
  namespace: erp-jsp
spec:
  selector:
    app: backend-canary
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-canary
  namespace: erp-jsp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-canary
  template:
    metadata:
      labels:
        app: backend-canary
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:18
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p 5432 -U erp -d erp; do
                echo "Waiting for PostgreSQL"
                sleep 5
              done
      containers:
        - name: backend
          image: erp-backend:canary
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/erp
            - name: DB_USERNAME
              value: erp
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: erp-postgres
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-canary
  namespace: erp-jsp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-canary
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: erp-proxy
  namespace: erp-jsp
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        name: erp-jsp-proxy
        type: LoadBalancer
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: erp
  namespace: erp-jsp
spec:
  gatewayClassName: erp-envoy
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: erp-proxy
  listeners:
    - name: http
      protocol: HTTP
      port: 8088
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: erp-jsp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      initContainers:
        - name: wait-for-backend
          image: erp-base-frontend:jsp-local
          imagePullPolicy: Never
          command:
            - bash
            - -c
            - |
              until (echo > /dev/tcp/backend/8080); do
                echo "Waiting for stable backend"
                sleep 5
              done
      containers:
        - name: frontend
          image: erp-base-frontend:jsp-local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BACKEND_URL
              value: http://backend:8080
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-canary
  namespace: erp-jsp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend-canary
  template:
    metadata:
      labels:
        app: frontend-canary
    spec:
      initContainers:
        - name: wait-for-backend
          image: erp-base-frontend:jsp-canary
          imagePullPolicy: Never
          command:
            - bash
            - -c
            - |
              until (echo > /dev/tcp/backend-canary/8080); do
                echo "Waiting for canary backend"
                sleep 5
              done
      containers:
        - name: frontend
          image: erp-base-frontend:jsp-canary
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BACKEND_URL
              value: http://backend-canary:8080
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-canary
  namespace: erp-jsp
spec:
  selector:
    app: frontend-canary
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend
  namespace: erp-jsp
spec:
  parentRefs:
    - name: erp
  hostnames:
    - erp-jsp.local
    - localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 8080
          weight: 90
        - name: frontend-canary
          port: 8080
          weight: 10
      sessionPersistence:
        sessionName: ERP_GATEWAY_SESSION
        type: Cookie
        cookieConfig:
          lifetimeType: Session
